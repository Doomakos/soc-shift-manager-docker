version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    networks:
      - soc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/analysts || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soc-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - soc-network
    stdin_open: true
    tty: true

networks:
  soc-network:
    driver: bridge
